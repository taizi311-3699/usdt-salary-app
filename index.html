<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>USDT业绩工资本</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 90px}main{max-width:550px;margin:auto}header{padding:24px 0 12px}h1{font-size:26px;margin:0}p{color:#697386;font-size:13px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #1a29420b}label{display:block;font-size:13px;color:#526078;margin:14px 0 6px}input,select{width:100%;font-size:17px;border:1px solid #dce2eb;border-radius:12px;padding:13px;background:#fff;color:#15243a}button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#2364dc;color:white;width:100%;margin-top:17px}.secondary{background:#eef2f8;color:#263a57}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.number{font-size:27px;font-weight:750;color:#1466db}.muted{font-size:12px;color:#7c879a}.item{padding:13px 0;border-bottom:1px solid #eef0f4}.item:last-child{border:0}.pill{font-size:12px;padding:4px 8px;background:#edf3ff;border-radius:20px;color:#2455a2}.danger{color:#b83b45;background:transparent;padding:7px}.small{font-size:12px}.check{display:flex;gap:8px;align-items:center;margin-top:12px}.check input{width:auto}footer{color:#8893a4;text-align:center;font-size:12px;padding:10px}.empty{color:#8893a4;text-align:center;padding:18px}</style></head><body><main><header><h1>💵 USDT 业绩工资本</h1><p>每天记录每笔业绩，自选工资点位 · 离线本地保存</p></header><section class="card"><div class="row"><strong>本月汇总</strong><input id="month" type="month" style="width:155px;font-size:14px;padding:8px"></div><div class="two" style="margin-top:20px"><div><div class="muted">总业绩（USDT）</div><div id="sumPerf" class="number">0.00</div></div><div><div class="muted">总工资（USDT）</div><div id="sumPay" class="number">0.00</div></div></div><div class="row" style="margin-top:16px"><span class="muted" id="sumCount">0 笔记录</span><button class="secondary small" id="export">导出CSV备份</button></div></section><section class="card"><strong>新增一笔业绩</strong><label for="date">日期</label><input type="date" id="date"><label for="amount">业绩金额（USDT）</label><input type="number" min="0" step="0.01" id="amount" inputmode="decimal" placeholder="例如 20000"><label for="rate">本笔工资提成点位</label><select id="rate"><option value="5">5%</option><option value="17">17%</option><option value="custom">自定义点位</option></select><div id="customWrap" hidden><label for="custom">自定义百分比（%）</label><input type="number" min="0" step="0.01" id="custom" placeholder="例如 12.5"></div><div class="check"><input id="deduct" type="checkbox"><label for="deduct" style="margin:0">本笔先扣换汇损耗</label></div><div id="lossWrap" hidden><label for="loss">换汇损耗点位（%），可修改</label><input id="loss" type="number" min="0" max="100" step="0.01" value="17.2"></div><label for="note">备注（可选）</label><input id="note" placeholder="例如 客户A / 上午业绩"><div class="row" style="margin-top:18px"><span>预计工资</span><strong id="preview" class="number">0.00 USDT</strong></div><p>计算：业绩 ×（1 − 可选损耗%）× 本笔提成%</p><button class="primary" id="save">保存这笔业绩</button></section><section class="card"><div class="row"><strong>本月业绩明细</strong><button id="clear" class="secondary small">清空本月</button></div><div id="records"></div></section><footer>数据只保存在当前浏览器设备内，请定期导出 CSV 备份。清理网站数据可能导致记录丢失。</footer></main><script>const $=id=>document.getElementById(id),key='usdtSalaryRecordsV1';let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(entries))entries=[]}catch{}const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};$('date').value=today();$('month').value=today().slice(0,7);const fmt=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const num=id=>Number($(id).value)||0;function rate(){return $('rate').value==='custom'?num('custom'):num('rate')}function calc(a,r,d,l){return a*(d?1-l/100:1)*r/100}function preview(){let a=num('amount'),r=rate(),l=num('loss');$('preview').textContent=fmt(calc(a,r,$('deduct').checked,l))+' USDT'}function persist(){localStorage.setItem(key,JSON.stringify(entries));render()}function render(){let m=$('month').value,items=entries.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('sumPerf').textContent=fmt(items.reduce((s,e)=>s+e.amount,0));$('sumPay').textContent=fmt(items.reduce((s,e)=>s+e.pay,0));$('sumCount').textContent=items.length+' 笔记录';let box=$('records');box.replaceChildren();if(!items.length){box.innerHTML='<div class="empty">这个月还没有记录</div>';return}items.forEach(e=>{let div=document.createElement('div');div.className='item';let head=document.createElement('div');head.className='row';let left=document.createElement('div');let strong=document.createElement('strong');strong.textContent=e.date+' · '+fmt(e.amount)+' USDT';let sub=document.createElement('div');sub.className='muted';sub.textContent='提成 '+e.rate+'%'+(e.deduct?' · 损耗 '+e.loss+'%':'')+(e.note?' · '+e.note:'');left.append(strong,sub);let right=document.createElement('div');right.style.textAlign='right';let pay=document.createElement('strong');pay.textContent=fmt(e.pay)+' USDT';let del=document.createElement('button');del.className='danger small';del.textContent='删除';del.onclick=()=>{if(confirm('删除这笔业绩？')){entries=entries.filter(x=>x.id!==e.id);persist()}};right.append(pay,document.createElement('br'),del);head.append(left,right);div.append(head);box.append(div)})}['amount','custom','loss'].forEach(id=>$(id).addEventListener('input',preview));$('rate').onchange=()=>{$('customWrap').hidden=$('rate').value!=='custom';preview()};$('deduct').onchange=()=>{$('lossWrap').hidden=!$('deduct').checked;preview()};$('month').onchange=render;$('save').onclick=()=>{let a=num('amount'),r=rate(),l=num('loss'),d=$('deduct').checked;if(!Number.isFinite(a)||a<=0||r<0||r>100||!Number.isFinite(r)||d&&(l<0||l>100)||!$('date').value){alert('请检查日期、业绩金额和百分比（0–100）');return}entries.push({id:Date.now()+Math.random(),date:$('date').value,amount:a,rate:r,deduct:d,loss:d?l:0,note:$('note').value.trim(),pay:calc(a,r,d,l)});$('month').value=$('date').value.slice(0,7);$('amount').value='';$('note').value='';preview();persist();alert('保存成功')};$('clear').onclick=()=>{let m=$('month').value;if(confirm('确定删除 '+m+' 的全部业绩？此操作无法撤销。')){entries=entries.filter(e=>!e.date.startsWith(m));persist()}};$('export').onclick=()=>{let rows=[['日期','业绩USDT','提成百分比','是否扣损耗','损耗百分比','工资USDT','备注'],...entries.map(e=>[e.date,e.amount,e.rate,e.deduct?'是':'否',e.loss,e.pay,e.note])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='USDT工资记录_'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();preview();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
